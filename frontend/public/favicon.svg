<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Background Container -->
  <rect width="512" height="512" rx="128" fill="url(#emeraldGrad)" />

  <!-- Heart with AI Pulse Line -->
  <g filter="url(#glow)">
    <!-- Heart Base -->
    <path
      d="M256 432s-144-88-144-200c0-48.6 39.4-88 88-88 31.8 0 59.8 16.8 76 42.2C292.2 160.8 320.2 144 352 144c48.6 0 88 39.4 88 88 0 112-144 200-144 200z"
      fill="none"
      stroke="#ffffff"
      stroke-width="28"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.25"
    />

    <!-- AI Pulse Line -->
    <path
      d="M120 256h70l25-50 40 100 35-70 20 35h82"
      fill="none"
      stroke="#ffffff"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>