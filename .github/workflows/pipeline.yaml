name: HealthNova AI CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ============================================
  # 1. FRONTEND CI (React + TypeScript)
  # ============================================
  frontend-ci:
    name: ⚡ Frontend CI (React + TS)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        run: npm ci || npm install

      - name: 🛠️ Build Frontend (TypeScript + Vite)
        run: npm run build
        env:
          VITE_API_URL: https://healthnovacom-production.up.railway.app/api

  # ============================================
  # 2. BACKEND CI (Node.js + Express + Prisma)
  # ============================================
  backend-ci:
    name: 🚀 Backend CI (Node + Express + Prisma)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🧪 Run Automated Tests (Jest)
        run: npm test

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: ./backend/package-lock.json

      - name: 📦 Install Backend Dependencies
        run: npm ci || npm install

      - name: 🔷 Generate Prisma Client
        run: npx prisma generate

      - name: 🛠️ Build Backend (TypeScript Compilation)
        run: npm run build

  # ============================================
  # 3. AI SERVICE CI (Python + Flask)
  # ============================================
  ai-service-ci:
    name: 🐍 AI Service CI (Python + Flask)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./ai-service

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ./ai-service/requirements.txt

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Check Python Code Syntax
        run: python -m compileall .
