version: "3.8"

services:
  # 1. AI Microservice (Python)
  ai-service:
    build:
      context: ./ai-service
    container_name: healthnova_ai_service
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    restart: unless-stopped
    networks:
      - healthnova-network

  # 2. Backend API (Node.js)
  backend:
    build:
      context: ./backend
    container_name: healthnova_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - AI_SERVICE_URL=http://ai-service:8000 # Docker internal network URL
    depends_on:
      - ai-service
    restart: unless-stopped
    networks:
      - healthnova-network

  # 3. Frontend (React)
  frontend:
    build:
      context: ./frontend
      args:
        # Pass backend URL to frontend during build
        - VITE_API_URL=http://localhost:5000/api
    container_name: healthnova_frontend
    ports:
      - "4173:4173"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - healthnova-network

networks:
  healthnova-network:
    driver: bridge
